name: Build and deploy Angular website
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JSON configuration
        run: npm run validate:json
      - name: Lint TypeScript and templates
        run: npm run lint
      - name: Build Angular production application
        run: |
          node scripts/deployment.mjs
          source deployment.env
          npx ng build --configuration production --base-href "$BASE_HREF"
      - name: Add GitHub Pages SPA fallback
        run: cp dist/deep-electro/browser/index.html dist/deep-electro/browser/404.html
      - name: Preserve custom domain
        run: |
          source deployment.env
          if [ -n "$CUSTOM_DOMAIN" ]; then echo "$CUSTOM_DOMAIN" > dist/deep-electro/browser/CNAME; fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/deep-electro/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
